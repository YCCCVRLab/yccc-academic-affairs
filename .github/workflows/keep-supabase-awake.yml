name: Keep Supabase active

on:
  schedule:
    # Four lightweight reads per day. Supabase pauses Free projects after a
    # week of low database activity.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-active
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query a public Supabase table
        env:
          # The publishable key is intentionally public and is also shipped in
          # supabase-config.js. No service-role key belongs in this workflow.
          SUPABASE_URL: https://okxwcvfololubyxcjurv.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_JwJ5Qp5Msj-YYi6E9yzy6A_-8Yfm6Wg
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/aa_site_settings?select=singleton&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          printf '%s\n' "$body"
          printf '%s' "$body" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const rows = JSON.parse(input);
              if (!Array.isArray(rows) || rows[0]?.singleton !== true) {
                console.error("Unexpected Supabase health-check response.");
                process.exit(1);
              }
              console.log("Supabase health check passed.");
            });
          '
