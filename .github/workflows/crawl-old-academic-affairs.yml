name: Crawl old Academic Affairs site

on:
  push:
    paths:
      - "scripts/crawl-academic-affairs.py"
      - ".github/workflows/crawl-old-academic-affairs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl old Academic Affairs site
        run: python scripts/crawl-academic-affairs.py
        env:
          MAX_PAGES: "500"
          CRAWL_DELAY: "0.8"
      - name: Commit crawl results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/source
          if git diff --cached --quiet; then
            echo "No crawl changes to commit."
          else
            git commit -m "Capture old Academic Affairs site source"
            git push
          fi