name: Crawl old Academic Affairs site

on:
  push:
    paths:
      - "scripts/crawl-academic-affairs.py"
      - "scripts/build-migration-inventory.py"
      - ".github/workflows/crawl-old-academic-affairs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl old Academic Affairs site
        run: python scripts/crawl-academic-affairs.py
        env:
          MAX_PAGES: "500"
          CRAWL_DELAY: "0.8"
      - name: Build migration inventory
        run: python scripts/build-migration-inventory.py
      - name: Commit crawl and inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/source
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Capture and index old Academic Affairs source"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
